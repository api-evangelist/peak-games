description: 'Peak (Peak Games) is a global mobile game developer headquartered in Istanbul, Turkey, best known
  for the casual puzzle titles Toon Blast and Toy Blast, which reach roughly 40 million monthly active users worldwide.
  The studio was acquired by Zynga in 2020 and operates teams across game development, art, big data and data science,
  and cloud platform engineering. Peak publishes consumer mobile games and does not expose a public developer API,
  developer portal, or API documentation; this profile is maintained as a company record in the API Evangelist network.'
